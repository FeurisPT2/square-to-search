[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
sts-core = { path = "crates/sts-core" }
sts-platform = { path = "crates/sts-platform" }
sts-ocr = { path = "crates/sts-ocr" }
sts-translate = { path = "crates/sts-translate" }
sts-search = { path = "crates/sts-search" }

slint = { version = "1.19.0", features = ["raw-window-handle-06", "unstable-winit-030"] }
slint-build = "1.19.0"
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
x11rb = { version = "0.13.2", features = ["shape"] }
oar-ocr = "0.11.0"
xcap = "0.9.10"
global-hotkey = "0.10.0"
tray-icon = { version = "0.26.1", default-features = false }
arboard = "3.7.0"
open = "5.4.5"
directories = "6.0.0"
lru = "0.19.1"
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream", "query"] }
sha2 = "0.11.1"
hex = "0.4.3"
tokio = { version = "1.54.1", features = ["full"] }
image = "0.25.10"
thiserror = "2.0.21"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
url = "2.5.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wiremock = "0.6.5"
tempfile = "3.27.0"
keyring = { version = "3.6.3", default-features = false }
base64 = "0.23.1"
ashpd = "0.14.3"
