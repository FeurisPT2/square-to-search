# cargo-deny 0.22.0 configuration for square-to-search

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    { crate = "cudarc", reason = "Decision 3A: v1 builds bundle CPU + DirectML only (no CUDA)" },
    { crate = "cuda-runtime-sys", reason = "Decision 3A: v1 builds bundle CPU + DirectML only (no CUDA)" },
    { crate = "cudnn-sys", reason = "Decision 3A: v1 builds bundle CPU + DirectML only (no CUDA)" },
    { crate = "cuda-sys", reason = "Decision 3A: v1 builds bundle CPU + DirectML only (no CUDA)" },
]

# Audited transitive duplicate versions across upstream GUI/OCR/Wayland crates.
